# Shared fixture corpus. error_kinds MUST match docs/implementation/error-handling.md.
error_kinds:
  # Header
  - header_malformed_magic
  - header_missing_version
  - header_malformed_kv
  - header_unclosed_quote
  - header_invalid_value
  - unknown_version
  # Columns
  - column_missing_name
  - column_missing_index
  - column_malformed_attribute
  - column_unknown_attribute
  - column_name_header_mismatch
  - column_title_header_mismatch
  - duplicate_column
  - column_count_mismatch
  - default_with_nulls
  # Data section
  - data_row_arity_mismatch
  - quote_none_delimiter_in_value
  - first_field_hash_unquoted
  - quoted_value_raw_newline
  # Aggregations
  - agg_arity_mismatch
  - agg_type_incompatible
  # SQL
  - sql_missing_colon
  - sql_embedded_newline
  - sql_unknown_verb
  - sql_unknown_dialect
  - sql_dialect_family
  - sql_version_mismatch
  - sql_no_match
  # Encoding
  - invalid_utf8
  - encoding_mismatch
  - encoding_not_ascii_compatible
  - encoding_unsupported
  # Checksum (all advisory)
  - checksum_mismatch
  - sidecar_checksum_mismatch
  - checksum_unknown_algorithm
  - checksum_malformed
  # Sidecar
  - sidecar_has_data_section
  - reference_on_inline
  - sidecar_reference_escapes_dir
  - sidecar_missing_reference
  - sidecar_reference_not_found
  - extsv_delim_mismatch
  # ZIP
  - zip_primary_not_first
  - zip_primary_bad_name
  - zip_missing_original_size
  - zip_original_size_mismatch
  - zip_unsupported_compression
  - zip_encrypted
  - zip_comment_not_excsv_prefix
  - zip_comment_not_utf8
  - zip_comment_header_disagree
  - row_parser_got_pack
  - pack_key_on_plain
  - original_size_on_plain
  - rows_mismatch
  # Pack
  - pack_manifest_missing_layout
  - pack_table_dir_missing
  - pack_table_header_missing
  - pack_column_count_mismatch
  - pack_col_line_count_mismatch
  - pack_section_partition_error
  - pack_section_boundary_mismatch

